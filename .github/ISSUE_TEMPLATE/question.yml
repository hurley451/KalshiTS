name: Question
description: Ask about KalshiTS usage, examples, or API coverage.
title: "Question: "
labels:
  - question
body:
  - type: input
    id: package-version
    attributes:
      label: SDK version or Git revision
      placeholder: "0.1.0 or commit SHA"
  - type: input
    id: runtime-version
    attributes:
      label: Node.js and TypeScript versions
      placeholder: "Node.js 24, TypeScript 5.9"
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and where are you stuck? Do not include credentials.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Relevant code or API surface
      description: Include a small snippet, operation ID, endpoint, or message type.
      render: typescript
