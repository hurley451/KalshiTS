name: KalshiCore Conformance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '41 11 * * *'
  workflow_dispatch:

jobs:
  conformance:
    name: Run KalshiCore fixtures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    permissions:
      contents: read

    env:
      CONFORMANCE_REPORT: KalshiTS/artifacts/kalshicore-conformance/report.json

    steps:
      - name: Check out KalshiTS
        uses: actions/checkout@v4
        with:
          path: KalshiTS

      - name: Check out KalshiCore
        uses: actions/checkout@v4
        with:
          repository: hurley451/KalshiCore
          path: KalshiCore
          ref: ${{ github.event_name == 'schedule' && 'main' || '99abf30c3fc818815e99f015299e2f4bcbf62a00' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: KalshiTS/package-lock.json

      - name: Install dependencies
        working-directory: KalshiTS
        run: npm ci

      - name: Build
        working-directory: KalshiTS
        run: npm run build

      - name: Verify full generated client
        id: generation
        working-directory: KalshiTS
        run: npm run check:generated -- --kalshicore-root "$GITHUB_WORKSPACE/KalshiCore"

      - name: Test
        working-directory: KalshiTS
        run: node --test dist/test/*.test.js test/*.test.mjs

      - name: Test packed consumer
        working-directory: KalshiTS
        run: npm run test:package

      - name: Run conformance adapter
        id: conformance
        working-directory: KalshiTS
        run: >-
          npm run conformance --
          --kalshicore-root "$GITHUB_WORKSPACE/KalshiCore"
          --report artifacts/kalshicore-conformance/report.json

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshicore-conformance-report-node-${{ matrix.node }}
          path: ${{ env.CONFORMANCE_REPORT }}
          if-no-files-found: warn

      - name: File KalshiCore contract gap
        if: always() && matrix.node == 24 && github.event_name == 'schedule' && (steps.conformance.outcome == 'failure' || steps.generation.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.KALSHICORE_ISSUE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GENERATION_OUTCOME: ${{ steps.generation.outcome }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "KALSHICORE_ISSUE_TOKEN is not configured; skipping parent issue filing."
            exit 0
          fi

          title="Contract gap: KalshiTS scheduled conformance drift"
          existing="$(gh issue list --repo hurley451/KalshiCore --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body_file="$(mktemp)"
          {
            echo "## Summary"
            echo "KalshiTS scheduled contract verification failed against KalshiCore main."
            echo
            echo "## Source links"
            echo "- Run: $RUN_URL"
            echo
            echo "## Affected SDK target"
            echo "- typescript.KalshiTS"
            echo
            echo "## Evidence"
            echo "- Full generated client verification: $GENERATION_OUTCOME"
            if [ -f "$CONFORMANCE_REPORT" ]; then
              echo '```json'
              cat "$CONFORMANCE_REPORT"
              echo '```'
            else
              echo "- No conformance report artifact was written."
            fi
            echo
            echo "## Acceptance criteria"
            echo "- Determine whether the failure belongs in KalshiCore contracts/fixtures or KalshiTS implementation."
            echo "- Update the affected repo and restore scheduled conformance."
          } > "$body_file"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo hurley451/KalshiCore --body-file "$body_file"
          else
            gh issue create --repo hurley451/KalshiCore --title "$title" --label contract-gap --body-file "$body_file"
          fi
